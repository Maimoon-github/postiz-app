# =============================================================================
# Full-Stack Local Build Docker Compose (Builds from local Dockerfile.dev)
# Orchestrates:
#   - postiz (Nginx :5000 -> Frontend :4200, Backend :3000, Orchestrator :3002 via PM2)
#   - postiz-postgres (PostgreSQL 17)
#   - postiz-redis (Redis 7.2)
#   - temporal, temporal-postgresql, temporal-elasticsearch, temporal-admin-tools, temporal-ui
#   - spotlight (Sentry Spotlight local debugger)
# =============================================================================

services:
  postiz:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: 'local-dev'
    image: localhost/postiz:local
    container_name: postiz
    restart: always
    env_file:
      - .env
    environment:
      MAIN_URL: 'http://localhost:4007'
      FRONTEND_URL: 'http://localhost:4007'
      NEXT_PUBLIC_BACKEND_URL: 'http://localhost:4007/api'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      JWT_SECRET: 'postiz-local-development-jwt-secret-key-change-in-production-9f8e7d6c5b4a'
      DATABASE_URL: 'postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      TEMPORAL_ADDRESS: 'temporal:7233'
      TEMPORAL_NAMESPACE: 'default'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      RUN_CRON: 'true'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: '/uploads'
      NX_ADD_PLUGINS: 'false'
      OPENAI_API_KEY: 'ollama'
      OPENAI_BASE_URL: 'http://host.docker.internal:11435/v1'
      OLLAMA_MODEL: 'qwen3.5:9b-q4_K_M'
      OLLAMA_FAST_MODEL: 'qwen3.5:4b-q4_K_M'
      OLLAMA_VISION_MODEL: 'qwen3-vl:8b-thinking-q4_K_M'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '4007:5000'
      - '3002:3002'
      - '8081:8081'
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
      ollama-bridge:
        condition: service_started

  ollama-bridge:
    image: node:22.20-bookworm-slim
    container_name: postiz-ollama-bridge
    restart: always
    network_mode: host
    command:
      - node
      - -e
      - |
        const net = require('net');
        net.createServer((c) => {
          const u = net.connect(11434, '127.0.0.1');
          c.pipe(u); u.pipe(c);
          c.on('error', () => u.destroy());
          u.on('error', () => c.destroy());
        }).listen(11435, '0.0.0.0', () => console.log('Ollama bridge listening on 0.0.0.0:11435 -> 127.0.0.1:11434'));

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  postiz-pg-admin:
    image: dpage/pgadmin4:latest
    container_name: postiz-pg-admin
    restart: always
    ports:
      - '8085:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - postiz-network

  postiz-redisinsight:
    image: redis/redisinsight:latest
    container_name: postiz-redisinsight
    restart: always
    ports:
      - '5540:5540'
    volumes:
      - redisinsight:/data
    networks:
      - postiz-network

  spotlight:
    pull_policy: always
    container_name: spotlight
    restart: always
    ports:
      - '8969:8969/tcp'
    image: ghcr.io/getsentry/spotlight:latest
    networks:
      - postiz-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    restart: always
    image: elasticsearch:7.17.27
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    restart: always
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  temporal:
    container_name: temporal
    restart: always
    ports:
      - '7233:7233'
    image: temporalio/auto-setup:1.28.1
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    restart: always
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

  temporal-ui:
    container_name: temporal-ui
    restart: always
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - '8082:8080'

volumes:
  redisinsight:
    external: false
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
